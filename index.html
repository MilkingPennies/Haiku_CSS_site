    <div class="parent">
            <div class="text">
                <h1>A Poppy Blooms</h1>
                <p class="author">Katsushika Hokusai</p>
            </div>
        <img src="img/Writing near a poppy flower.jpg"
        alt="Image inspired by the haiku"> 
    </div>
     <p class="haiku">
                I write, erase, rewrite<br>
                Erase again, and then<br>
                A poppy blooms.
     </p>
